name: CI

on:
  push:
    branches: [ main, 001-number ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx fastapi prometheus_client
      - name: Set test env
        run: |
          echo "API_TEST_TOKEN=test-token" >> $GITHUB_ENV
      - name: Run tests
        run: |
          pytest -q
